version: '3.8'

services:
  curl-exec:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CURL_EXEC_AUTH_TOKEN=${CURL_EXEC_AUTH_TOKEN:-your-secure-token-here}
      - CURL_EXEC_AUTH_HEADER=${CURL_EXEC_AUTH_HEADER:-X-Auth-Token}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s