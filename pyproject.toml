[project]
name = "vulnverify-tools"
version = "0.1.0"
description = "Vulnerability Verification Tools Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.35,<1.0",
    "pydantic-settings>=2.5.2,<3.0",
    "requests==2.31.0",
    "selenium==4.16.0",
    "webdriver-manager==4.0.1",
    "mcp==1.27.0",
    "fastmcp==3.2.4",
    "starlette>=0.27.0"
]

[project.optional-dependencies]
test = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
